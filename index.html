<style>
:root {
  --text: #1d1d1f;
  --secondary: #6e6e73;
  --background: #f5f5f7;
  --surface: #ffffff;
  --border: #d2d2d7;
  --action: #0071e3;
  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-pill: 9999px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--background);
  color: var(--text);
  font: 400 clamp(1rem, 1.2vw, 1.25rem)/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  letter-spacing: .02em;
}
main { max-width: 760px; margin: auto; padding: 64px 24px; }
header, form { margin-bottom: 64px; }
h1 { margin: 0 0 24px; font-size: clamp(2.5rem, 8vw, 5rem); font-weight: 700; letter-spacing: -.03em; line-height: 1.04; }
header p, #notice, dt { color: var(--secondary); }
header p { max-width: 32rem; margin: 0; }
form { display: flex; gap: 16px; }
input, button { min-height: 56px; font: inherit; }
input {
  min-width: 0;
  flex: 1;
  padding: 0 24px;
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  background: var(--surface);
  color: var(--text);
}
input:focus, button:focus { outline: 2px solid var(--text); outline-offset: 2px; }
button {
  flex: 0 0 auto;
  padding: 0 24px;
  border: 1px solid var(--action);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--action);
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}
button:hover, article:hover { opacity: .9; }
#notice { min-height: 32px; margin: 0 0 24px; }
#notice.error, #notice.success { color: var(--text); }
#notice.error { font-weight: 700; }
#review-entry { display: block; width: 100%; margin-top: 64px; text-align: center; }
#list { display: grid; gap: 48px; }
article { padding: 24px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface); }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 32px; }
.plate { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -.03em; }
.fine, .score { font-weight: 700; }
.fine { white-space: nowrap; }
dl { display: grid; gap: 24px; margin: 0; }
.row { display: grid; grid-template-columns: 96px 1fr; gap: 16px; }
dd { margin: 0; word-break: break-word; }
.review-modal[hidden] { display: none; }
.review-modal { position: fixed; inset: 0; z-index: 1; display: grid; place-items: center; padding: 24px; background: rgba(29, 29, 31, .65); }
.modal-card { width: min(100%, 640px); max-height: calc(100dvh - 48px); overflow: auto; padding: 24px; border-radius: var(--radius-lg); background: var(--surface); }
.modal-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
.modal-head h2 { margin: 0; font-size: 1.25rem; font-weight: 700; letter-spacing: -.03em; }
.modal-head button { min-height: 40px; padding: 0 16px; }
.modal-card img { display: block; width: 100%; height: auto; border-radius: var(--radius-md); -webkit-touch-callout: default; user-select: auto; }
.reveal { opacity: 0; transform: translateY(20px); transition: opacity .8s cubic-bezier(.25, .1, .25, 1), transform .8s cubic-bezier(.25, .1, .25, 1); }
.reveal.is-visible { opacity: 1; transform: translateY(0); }
@media (max-width: 480px) {
  main { padding: 48px 16px; }
  form { display: grid; grid-template-columns: 1fr; }
  input, button { width: 100%; }
  .modal-head { align-items: flex-start; }
  .modal-head button { width: auto; }
  .row { grid-template-columns: 1fr; gap: 8px; }
  .top { display: grid; gap: 8px; margin-bottom: 32px; }
}
@media (prefers-reduced-motion: reduce) {
  .reveal { opacity: 1; transform: none; transition: none; }
}
</style>
<main>

const $ = id => document.getElementById(id);
const esc = value => String(value ?? "").replace(/[&<>\"]/g, char => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;"
}[char]));

const reveal = nodes => {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    nodes.forEach(node => node.classList.add("is-visible"));
    return;
  }
  const observer = new IntersectionObserver(entries => entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add("is-visible");
      observer.unobserve(entry.target);
    }
  }), { threshold: .1 });
  nodes.forEach(node => observer.observe(node));
};

const closeReview = () => { $("review-modal").hidden = true; };
$("review-entry").addEventListener("click", () => { $("review-modal").hidden = false; });
$("review-close").addEventListener("click", closeReview);
$("review-modal").addEventListener("click", event => {
  if (event.target === $("review-modal")) closeReview();
});

function show(items) {
  $("list").innerHTML = items.map(item => `
    <article class="reveal">
      <div class="top">
        <h2 class="plate">${esc(item["车牌"])}</h2>
        <div class="fine">罚款 ¥${esc(item["罚款金额"])}</div>
      </div>
      <dl>
        <div class="row"><dt>交警队</dt><dd>${esc(item["对应交警队"])}</dd></div>
        <div class="row"><dt>违法时间</dt><dd>${esc(item["违法时间"])}</dd></div>
        <div class="row"><dt>违法项名称</dt><dd>${esc(item["违法项名称"])}</dd></div>
        <div class="row"><dt>扣分情况</dt><dd class="score">${esc(item["有否扣分"])}</dd></div>
      </dl>
    </article>`).join("");
  reveal([...document.querySelectorAll("#list .reveal")]);
}

reveal([...document.querySelectorAll("main > .reveal")]);
$("form").addEventListener("submit", event => {
  event.preventDefault();
  const name = $("name").value.trim();
  $("list").innerHTML = "";
  if (!name) {
    $("notice").className = "reveal is-visible error";
    $("notice").textContent = "请输入司机姓名。";
    return;
  }
  const items = db.filter(item => String(item["司机"]).trim() === name);
  if (!items.length) {
    $("notice").className = "reveal is-visible error";
    $("notice").textContent = "未找到该司机的罚单记录，请核对姓名。";
    return;
  }
  $("notice").className = "reveal is-visible success";
  $("notice").textContent = `找到 ${items.length} 条罚单记录。`;
  show(items);
});
</script>
